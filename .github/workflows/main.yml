name: Build JITOZ Taxi APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JITOZ_Taxi_Android.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack project
        run: unzip -q JITOZ_Taxi_Android.zip -d androidproj

      - name: Create Android local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > androidproj/local.properties

      - name: Build APK
        working-directory: androidproj
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp androidproj/app/build/outputs/apk/debug/app-debug.apk JITOZ-Taxi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JITOZ-Taxi-APK
          path: JITOZ-Taxi.apk
