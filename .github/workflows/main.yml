name: Build JITOZ Taxi APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JITOZ_Taxi_Android.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unpack project
        run: unzip -q JITOZ_Taxi_Android.zip -d androidproj

      - name: Build APK
        working-directory: androidproj
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp androidproj/app/build/outputs/apk/debug/app-debug.apk JITOZ-Taxi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JITOZ-Taxi-APK
          path: JITOZ-Taxi.apk
